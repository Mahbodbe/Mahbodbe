<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" role="img" aria-label="Mahbod BemaniCham — Electrical Engineering @ AUT">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0D1526"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="traceCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#34D399" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="848" height="228" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .wave {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawWave 4.5s ease-in-out infinite;
    }
    .pulse {
      animation: pulseDot 2.2s ease-in-out infinite;
    }
    .blink {
      animation: blinkCursor 1.2s steps(2, start) infinite;
    }
    @keyframes drawWave {
      0% { stroke-dashoffset: 1200; opacity: 0.35; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 0.85; }
      100% { stroke-dashoffset: -1200; opacity: 0.25; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; r: 3; }
      50% { opacity: 1; r: 4.2; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Card Background -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="850" height="230" fill="url(#bg)"/>
    <rect x="0" y="0" width="850" height="230" fill="url(#grid)"/>

    <!-- Ambient Glows -->
    <circle cx="130" cy="45" r="140" fill="#38BDF8" opacity="0.06"/>
    <circle cx="740" cy="185" r="160" fill="#34D399" opacity="0.055"/>

    <!-- Subtle PCB Circuit Traces (Right Side) -->
    <g stroke="#1E3A5F" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M 610 0 L 610 42 L 642 74 L 745 74 L 765 54 L 850 54"/>
      <path d="M 665 0 L 665 30 L 690 55 L 790 55"/>
      <path d="M 560 230 L 592 198 L 710 198 L 735 173 L 850 173"/>
      <path d="M 700 230 L 700 212 L 725 187 L 820 187"/>
      <circle cx="642" cy="74" r="3" fill="#0D1526" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="745" cy="74" r="3" fill="#0D1526" stroke="#34D399" stroke-width="1.2"/>
      <circle cx="710" cy="198" r="3" fill="#0D1526" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="820" cy="187" r="3" fill="#0D1526" stroke="#34D399" stroke-width="1.2"/>
    </g>

    <!-- Background Static Oscilloscope Trace -->
    <path d="M 0 188 L 110 188 L 122 188 L 130 162 L 138 206 L 146 174 L 154 188 L 285 188 L 295 170 L 303 170 L 303 202 L 315 202 L 315 170 L 327 170 L 327 188 L 480 188 L 492 156 L 502 212 L 512 168 L 522 188 L 650 188 L 660 175 L 672 201 L 682 188 L 850 188"
          fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Animated Signal Trace -->
    <path class="wave" filter="url(#glow)"
          d="M 0 188 L 110 188 L 122 188 L 130 162 L 138 206 L 146 174 L 154 188 L 285 188 L 295 170 L 303 170 L 303 202 L 315 202 L 315 170 L 327 170 L 327 188 L 480 188 L 492 156 L 502 212 L 512 168 L 522 188 L 650 188 L 660 175 L 672 201 L 682 188 L 850 188"
          fill="none" stroke="url(#traceCyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top Status Bar -->
    <g transform="translate(36, 26)">
      <circle cx="6" cy="6" r="3.5" fill="#34D399" class="pulse"/>
      <text x="18" y="10" class="mono" font-size="11" fill="#94A3B8" letter-spacing="1.2">SYS://MAHBODBE  ·  AMIRKABIR UNIVERSITY OF TECHNOLOGY (AUT)</text>
    </g>

    <!-- Right Corner Telemetry Readout -->
    <g transform="translate(692, 22)">
      <rect x="0" y="0" width="122" height="22" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="61" y="14.5" text-anchor="middle" class="mono" font-size="10" fill="#38BDF8" letter-spacing="0.8">TEHRAN · IR</text>
    </g>

    <!-- Main Name -->
    <text x="36" y="96" class="sans" font-size="38" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.8">Mahbod BemaniCham</text>

    <!-- Subtitle with Blinking Cursor -->
    <text x="38" y="126" class="mono" font-size="14" fill="#94A3B8">
      <tspan fill="#38BDF8">&gt;</tspan> Electrical Engineering Student · Building from <tspan fill="#E2E8F0">Silicon</tspan> to <tspan fill="#34D399">Interface</tspan><tspan class="blink" fill="#38BDF8">_</tspan>
    </text>

    <!-- Domain Pills -->
    <g transform="translate(36, 144)" class="mono" font-size="10.5">
      <rect x="0" y="0" width="118" height="24" rx="6" fill="#0F1D32" stroke="#1E3A5F" stroke-width="1"/>
      <text x="59" y="15.5" text-anchor="middle" fill="#7DD3FC">EMBEDDED / MCU</text>

      <rect x="128" y="0" width="108" height="24" rx="6" fill="#0F1D32" stroke="#1E3A5F" stroke-width="1"/>
      <text x="182" y="15.5" text-anchor="middle" fill="#A7F3D0">VHDL / FPGA</text>

      <rect x="246" y="0" width="116" height="24" rx="6" fill="#0F1D32" stroke="#1E3A5F" stroke-width="1"/>
      <text x="304" y="15.5" text-anchor="middle" fill="#7DD3FC">QT / C++23</text>

      <rect x="372" y="0" width="142" height="24" rx="6" fill="#0F1D32" stroke="#1E3A5F" stroke-width="1"/>
      <text x="443" y="15.5" text-anchor="middle" fill="#A7F3D0">SCADA / IEC 61850</text>

      <rect x="524" y="0" width="108" height="24" rx="6" fill="#0F1D32" stroke="#1E3A5F" stroke-width="1"/>
      <text x="578" y="15.5" text-anchor="middle" fill="#7DD3FC">NETSEC / IDS</text>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="848" height="228" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>
</svg>
